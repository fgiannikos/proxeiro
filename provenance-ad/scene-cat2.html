<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a)));
const lerp = (a, b, u) => a + (b - a) * u;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };

// Eyes: amber iris, slit pupil, a lid clipped to the eye that closes from the top.
const eyes = [...document.querySelectorAll('.eye')].map((g, k) => {
  const x = +g.dataset.x, y = +(g.dataset.y || -252), rx = +(g.dataset.rx || 15), ry = +(g.dataset.ry || 13), k1 = rx / 15;
  const clip = mk('clipPath', { id: 'eyeClip' + k }, g);
  mk('ellipse', { cx: x, cy: y, rx, ry }, clip);
  mk('ellipse', { cx: x, cy: y, rx, ry, fill: '#F2C230' }, g);
  const inner = mk('g', { 'clip-path': `url(#eyeClip${k})` }, g);
  const pupil = mk('ellipse', { cx: x, cy: y, rx: 6 * k1, ry: ry * 0.72, fill: '#111' }, inner);
  const glint = mk('circle', { cx: x - 4 * k1, cy: y - 5, r: 3.6 * k1 + 0.6, fill: '#FFF8EC' }, inner);
  const glint2 = mk('circle', { cx: x + 3 * k1, cy: y + 4, r: 1.6 * k1 + 0.3, fill: '#FFF8EC' }, inner);
  const lid = mk('path', { d: '', fill: '#1F1C24', stroke: '#0E0C10', 'stroke-width': 2.5 }, inner);
  return { x, y, rx, ry, k1, pupil, glint, glint2, lid };
});
function setEyes(close, lookX, lookY, dilate) {
  for (const e of eyes) {
    const px = e.x + lookX * e.k1, py = e.y + lookY * e.k1;
    e.pupil.setAttribute('cx', px); e.pupil.setAttribute('cy', py); e.pupil.setAttribute('rx', (6 + 2.5 * dilate) * e.k1);
    e.glint.setAttribute('cx', px - 4 * e.k1); e.glint.setAttribute('cy', py - 5 * e.k1);
    e.glint2.setAttribute('cx', px + 3 * e.k1); e.glint2.setAttribute('cy', py + 4 * e.k1);
    const w = e.rx + 3, b = e.y - e.ry - 1 + (2 * e.ry + 2) * close;     // lower edge of the lid
    e.lid.setAttribute('d', `M ${e.x - w},${e.y - e.ry - 18} L ${e.x + w},${e.y - e.ry - 18} L ${e.x + w},${b} Q ${e.x},${b + 4} ${e.x - w},${b} Z`);
  }
}

// Legs: straight, swinging back and forth like a pendulum; diagonal pairs move together.
const LEGS = [  // [pivot x, pivot y, length, phase, near?]
  [-66, -124, 122, 0, true], [60, -122, 120, Math.PI, true],
  [-52, -124, 122, Math.PI, false], [66, -122, 120, 0, false]];
const legEls = LEGS.map(L => {
  const g = mk('g', {}, $(L[4] ? 'nearLegs' : 'farLegs'));
  const col = L[4] ? '#1F1C24' : '#141218';
  const o = mk('path', { fill: 'none', stroke: '#0E0C10', 'stroke-width': 17, 'stroke-linecap': 'round' }, g);
  const f = mk('path', { fill: 'none', stroke: col, 'stroke-width': 11, 'stroke-linecap': 'round' }, g);
  const paw = mk('ellipse', { rx: 10, ry: 5.5, fill: col, stroke: '#0E0C10', 'stroke-width': 3 }, g);
  return { o, f, paw };
});
const S = 72, DROP = 20;                                // px covered per step cycle
function setLegs(d, gait, bob) {
  LEGS.forEach(([hx, hy, L, ph], i) => {
    hy += bob + DROP; L -= DROP;
    const p = 2 * Math.PI * d / S + ph, th = 0.4 * Math.sin(p) * gait;
    const len = L - bob - 12 * Math.max(0, Math.cos(p)) * gait;     // the swinging leg lifts its paw
    const fx = hx + len * Math.sin(th), fy = hy + len * Math.cos(th);
    const mx = hx + 0.5 * len * Math.sin(th) - 4, my = hy + 0.5 * len * Math.cos(th);
    const d_ = `M ${hx},${hy} Q ${mx.toFixed(1)},${my.toFixed(1)} ${fx.toFixed(1)},${fy.toFixed(1)}`;
    legEls[i].o.setAttribute('d', d_); legEls[i].f.setAttribute('d', d_);
    legEls[i].paw.setAttribute('cx', fx + 5); legEls[i].paw.setAttribute('cy', fy - 1);
  });
}

// Tail: a chain of segments, curling into a question mark; a smooth path through the joints.
function setTail(sway, phase, lift) {
  const pts = [[-104, -146 + DROP]]; let ang = (-130 - 18 * lift) * Math.PI / 180;
  for (let i = 0; i < 8; i++) {
    ang += (4 + 2 * lift + (i > 4 ? 22 : 0) + sway * Math.sin(phase - i * 0.55)) * Math.PI / 180;
    const [x, y] = pts[pts.length - 1]; pts.push([x + 21 * Math.cos(ang), y + 21 * Math.sin(ang)]);
  }
  let d = `M ${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    d += ` C ${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  $('tail').setAttribute('d', d); $('tailO').setAttribute('d', d);
}

const pops = [...document.querySelectorAll('.pop')];
const DOG = window.PAINTING || 'painting.jpg', CAT_IMG = window.CATPAINTING || 'painting-cat.jpg';
$('dogPainting').setAttribute('href', DOG);
document.querySelectorAll('.catpainting').forEach(el => el.setAttribute('href', CAT_IMG));
const load = src => new Promise(res => { const im = new Image(); im.onload = () => im.decode().then(res); im.src = src; });
window.ready = Promise.all([load(DOG), load(CAT_IMG)]);

const blink = (t, t0, d = 0.16) => { const u = (t - t0) / d; return u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0; };
const X0 = 200, X1 = 690, GY = 1610, W0 = 3.2, W1 = 6.5, FLASH = 9.55;

window.renderAt = function (t) {
  pops.forEach(g => { g.setAttribute('opacity', 1); g.removeAttribute('transform'); });
  const bowl = document.querySelector('.pop[data-o="800,1565"]');
  if (bowl) bowl.setAttribute('transform', 'translate(170,20)');

  // ── Darkness, two amber eyes on the left; the shelf lamp clicks on at 2.5 s.
  let dark = 0.94;
  if (t >= 2.5) dark = t < 2.55 ? 0.25 : t < 2.62 ? 0.6 : 0.6 * (1 - prog(t, 2.62, 2.85));
  $('dark').setAttribute('opacity', dark);
  $('glow').setAttribute('opacity', t >= 2.5 ? (t < 2.55 ? 1 : t < 2.62 ? 0.4 : 1) : 0);

  // ── Walk: left -> right; the paws follow the distance covered, so they never slide.
  const u = clamp((t - W0) / (W1 - W0)), x = lerp(X0, X1, (1 - Math.cos(Math.PI * u)) / 2), d = x - X0;
  const gait = prog(t, W0 - 0.1, W0 + 0.25) * (1 - prog(t, W1 - 0.15, W1 + 0.25));
  const bob = -3 * Math.abs(Math.sin(2 * Math.PI * d / S)) * gait;
  $('cat').setAttribute('transform', `translate(${x},${GY})`);
  setLegs(d, gait, bob);
  ['catBody', 'haunch', 'collar'].forEach(id => $(id).setAttribute('transform', `translate(0,${bob + DROP})`));

  // ── Head: faces us in the dark, turns to profile to walk, turns back to pose.
  const h = 1 - prog(t, 2.95, 3.3) + prog(t, 6.75, 7.1);            // 1 = facing camera
  const side = h < 0.5, sq = side ? 1 - 1.3 * h : 0.35 + 1.3 * (h - 0.5);
  $('headSide').setAttribute('opacity', side ? 1 : 0); $('headFront').setAttribute('opacity', side ? 0 : 1);
  $('headSide').setAttribute('transform', `scale(${Math.max(0.05, sq)},1)`);
  $('headFront').setAttribute('transform', `scale(${Math.min(1, Math.max(0.05, sq))},1)`);
  const pose = prog(t, 7.05, 7.6);
  const nod = 2 * Math.sin(4 * Math.PI * d / S + 0.8) * gait;
  $('headPivot').setAttribute('transform', `translate(116,${-238 + DROP + bob + nod - 6 * pose}) rotate(${-2.5 * pose + 1.5 * Math.sin(t * 1.3) * pose})`);

  let close = Math.max(blink(t, 0.9), blink(t, 1.85), blink(t, 4.6, 0.16));
  close = Math.max(close, blink(t, 8.85, 0.6) * 0.95, blink(t, 12.9, 0.7) * 0.95);   // slow "cat kiss" blinks
  setEyes(close, 0, 0, 1 - prog(t, 2.5, 3.2) + 0.5 * prog(t, 9.2, 9.5) * (1 - prog(t, 9.6, 9.8)));

  // Tail: lazy sway in the dark, swings with the stride, rises proud for the pose.
  const lift = prog(t, W0, W0 + 0.6) * 0.5 + 0.5 * pose;
  setTail(4 + 3 * gait, gait > 0.01 ? 2 * Math.PI * d / S : t * 2.2, lift);

  // ── Flash: the pose becomes the painting in the empty frame.
  const fl = t < FLASH - 0.08 ? 0 : t < FLASH ? (t - FLASH + 0.08) / 0.08 : t < FLASH + 0.12 ? 1 : 1 - prog(t, FLASH + 0.12, FLASH + 0.9);
  $('flash').setAttribute('opacity', fl);
  const shown = t >= FLASH ? 1 : 0;
  $('real').setAttribute('opacity', shown); $('frameGold').setAttribute('opacity', shown);

  // ── Camera.
  const lerpState = (A, B, k) => {
    const sc = Math.exp(Math.log(A.s) + (Math.log(B.s) - Math.log(A.s)) * k);
    const kk = (A.s === B.s) ? k : (sc - A.s) / (B.s - A.s);
    return { s: sc, x: A.x + (B.x - A.x) * kk, y: A.y + (B.y - A.y) * kk };
  };
  const at = (s, wx, wy, scx, scy) => ({ s, x: scx - wx * s, y: scy - wy * s });
  const WIDE = { s: 1, x: 0, y: 0 };
  const FACE = at(2.0, X1 + 60, GY - 230, 540, 1040);
  const PAINT_IN = at(3.3, 750, 620, 540, 960), PAINT = at(3.0, 750, 620, 540, 960);
  const CARD = { s: 0.62, x: 540 - 540 * 0.62, y: -60 };
  let cam = WIDE;
  if (t >= 8.0) cam = lerpState(WIDE, FACE, prog(t, 8.0, 8.8));
  if (t >= FLASH) cam = lerpState(PAINT_IN, PAINT, prog(t, FLASH, 11.6));
  if (t >= 11.8) cam = lerpState(PAINT, WIDE, prog(t, 11.8, 12.8));
  if (t >= 14.0) cam = lerpState(WIDE, CARD, prog(t, 14.0, 14.7));
  $('world').setAttribute('transform', `translate(${cam.x},${cam.y}) scale(${cam.s})`);
  $('card').setAttribute('opacity', prog(t, 14.4, 15.0));
};
window.ready.then(() => window.renderAt(0));
</script>
</body>
</html>
