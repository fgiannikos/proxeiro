<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,300;0,400;1,300&family=Noto+Serif:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F5EFE4; }
  svg { display: block; }
  .ink { fill: none; stroke: #2E2823; stroke-linecap: round; stroke-linejoin: round; }
  .t1 { font-family: 'Noto Serif Display', serif; font-weight: 300; font-size: 68px; fill: #2E2823; }
  .t2 { font-family: 'Noto Serif Display', serif; font-weight: 400; font-size: 40px; letter-spacing: 12px; fill: #2E2823; }
  .t3 { font-family: 'Noto Serif', serif; font-size: 34px; fill: #8A6A35; letter-spacing: 2px; }
</style>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- watercolor: displaced, softened shapes -->
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="38" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.06 0"/>
    </filter>
    <filter id="edge"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="60"/><feGaussianBlur stdDeviation="6"/></filter>
    <!-- bloom masks -->
    <mask id="mFrame"><circle id="mFrameC" cx="540" cy="700" r="0" fill="#fff" filter="url(#edge)"/></mask>
    <mask id="mDog"><circle id="mDogC" cx="540" cy="1380" r="0" fill="#fff" filter="url(#edge)"/></mask>
    <clipPath id="frameClip"><rect x="352" y="452" width="376" height="476"/></clipPath>

    <!-- labrador head, front view, centred at 0,0 -->
    <g id="headInk">
      <path d="M -66,-48 C -70,-112 70,-112 66,-48"/>
      <path d="M -64,-62 C -112,-56 -128,6 -110,52 C -100,76 -78,68 -72,36"/>
      <path d="M 64,-62 C 112,-56 128,6 110,52 C 100,76 78,68 72,36"/>
      <path d="M -72,36 C -70,72 -56,92 -42,104"/>
      <path d="M 72,36 C 70,72 56,92 42,104"/>
      <path d="M -42,104 C -50,138 -26,160 0,160 C 26,160 50,138 42,104"/>
      <path d="M -26,-6 C -38,-14 -46,-8 -48,-2"/>
      <path d="M 26,-6 C 38,-14 46,-8 48,-2"/>
      <path d="M 0,112 L 0,126 M -24,134 C -12,142 -4,138 0,126 C 4,138 12,142 24,134"/>
    </g>
    <g id="headSolid">
      <circle cx="-32" cy="12" r="8"/>
      <circle cx="32" cy="12" r="8"/>
      <path d="M -20,94 C -20,80 20,80 20,94 C 20,106 6,114 0,114 C -6,114 -20,106 -20,94 Z"/>
    </g>
    <!-- wash shapes for the head -->
    <g id="headWash">
      <path d="M -66,-48 C -70,-112 70,-112 66,-48 C 74,10 72,40 72,36 C 70,72 56,92 42,104 C 50,138 26,160 0,160 C -26,160 -50,138 -42,104 C -56,92 -70,72 -72,36 C -72,40 -74,10 -66,-48 Z" fill="#E2B56E"/>
      <path d="M -64,-62 C -112,-56 -128,6 -110,52 C -100,76 -78,68 -72,36 Z" fill="#C98F48"/>
      <path d="M 64,-62 C 112,-56 128,6 110,52 C 100,76 78,68 72,36 Z" fill="#C98F48"/>
      <path d="M -40,100 C -48,136 -26,158 0,158 C 26,158 48,136 40,100 Z" fill="#F1D4A2"/>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="#F5EFE4"/>
  <rect width="1080" height="1920" filter="url(#paper)"/>

  <g id="world">
    <!-- room line work -->
    <g class="ink" stroke-width="5" id="room">
      <path class="draw" d="M 40,1380 L 1040,1380"/>                                   <!-- wall/floor -->
      <path class="draw" d="M 90,1380 L 90,900 L 270,900 L 270,1380"/>                 <!-- door -->
      <path class="draw" d="M 240,1150 L 240,1170"/>                                   <!-- handle -->
      <path class="draw" d="M 330,430 L 750,430 L 750,950 L 330,950 Z"/>              <!-- frame outer -->
      <path class="draw" d="M 352,452 L 728,452 L 728,928 L 352,928 Z"/>              <!-- frame inner -->
      <path class="draw" d="M 540,330 L 400,430 M 540,330 L 680,430"/>                 <!-- hanging wire -->
      <path class="draw" d="M 800,1380 L 800,1210 C 800,1180 830,1170 860,1170 L 1080,1170"/> <!-- sofa back -->
      <path class="draw" d="M 800,1300 L 1080,1300"/>                                  <!-- sofa seat -->
      <path class="draw" d="M 840,1380 L 840,1410 M 1020,1380 L 1020,1410"/>          <!-- sofa legs -->
    </g>

    <!-- framed portrait: wash + ink -->
    <g clip-path="url(#frameClip)">
      <g mask="url(#mFrame)" filter="url(#wc)">
        <rect x="330" y="430" width="420" height="520" fill="#A9BCA6" opacity="0.75"/>
        <ellipse cx="540" cy="560" rx="200" ry="140" fill="#9DB4C6" opacity="0.6"/>
        <path d="M 400,930 C 420,800 470,780 540,780 C 610,780 660,800 680,930 Z" fill="#D9A660"/>
        <use href="#headWash" transform="translate(540,640) scale(1.15)"/>
      </g>
      <g id="portraitInk" opacity="0">
        <g class="ink" stroke-width="4" transform="translate(540,640) scale(1.15)"><use href="#headInk"/></g>
        <g fill="#2E2823" transform="translate(540,640) scale(1.15)"><use href="#headSolid"/></g>
        <path class="ink" stroke-width="4" d="M 400,930 C 420,800 470,790 492,820 M 680,930 C 660,800 610,790 588,820"/>
      </g>
    </g>
    <g id="frameGold" opacity="0">
      <path d="M 330,430 L 750,430 L 750,950 L 330,950 Z M 352,452 L 352,928 L 728,928 L 728,452 Z" fill="#B8924A" fill-rule="evenodd"/>
      <path class="ink" stroke-width="5" d="M 330,430 L 750,430 L 750,950 L 330,950 Z M 352,452 L 728,452 L 728,928 L 352,928 Z"/>
    </g>

    <!-- paw prints -->
    <g id="paws" fill="#2E2823"></g>

    <!-- the living dog, sitting, front view -->
    <g id="dog" transform="translate(540,1180)">
      <g mask="url(#mDog)" filter="url(#wc)" transform="translate(-540,-1180)">
        <g transform="translate(540,1180)">
          <path d="M -60,110 C -100,170 -104,250 -92,320 C -136,330 -146,400 -118,420 L 118,420 C 146,400 136,330 92,320 C 104,250 100,170 60,110 Z" fill="#DDAE66"/>
          <use href="#headWash"/>
          <path d="M -30,170 C -20,230 20,230 30,170 C 20,200 -20,200 -30,170 Z" fill="#F1D4A2"/>
        </g>
      </g>
      <g class="ink" stroke-width="5">
        <use href="#headInk" class="drawUse"/>
        <path class="draw" d="M -52,112 C -96,168 -102,250 -90,322"/>
        <path class="draw" d="M 52,112 C 96,168 102,250 90,322"/>
        <path class="draw" d="M -90,322 C -136,332 -148,400 -116,420 L -74,420"/>
        <path class="draw" d="M 90,322 C 136,332 148,400 116,420 L 74,420"/>
        <path class="draw" d="M -44,230 L -46,396 M 44,230 L 46,396"/>
        <path class="draw" d="M -76,420 C -78,396 -28,392 -24,420 Z M 24,420 C 28,392 78,396 76,420 Z"/>
        <path class="draw" d="M -24,420 L 24,420"/>
      </g>
      <g id="tail" transform="translate(112,418)"><path class="ink draw" stroke-width="5" d="M 0,0 C 38,4 60,-14 52,-40"/></g>
      <g id="dogSolid" fill="#2E2823" opacity="0"><use href="#headSolid"/></g>
    </g>
  </g>

  <!-- end card -->
  <g id="card" opacity="0" text-anchor="middle">
    <text class="t1" x="540" y="1140">Μια θέση τιμής</text>
    <text class="t1" x="540" y="1230">στο σπίτι.</text>
    <path d="M 470,1300 L 610,1300" stroke="#B8924A" stroke-width="3"/>
    <text class="t2" x="546" y="1380">PROVENANCE EDITIONS</text>
    <text class="t3" x="540" y="1460">Δες τη συλλογή →</text>
  </g>
</svg>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a)));

// Expand <use> in the dog's head so each stroke can be "drawn".
const drawUse = document.querySelector('.drawUse');
const headClone = document.getElementById('headInk').cloneNode(true);
headClone.removeAttribute('id');
headClone.querySelectorAll('path').forEach(p => p.classList.add('draw', 'dogHead'));
drawUse.replaceWith(headClone);

const roomPaths = [...document.querySelectorAll('#room .draw')];
const dogPaths = [...document.querySelectorAll('#dog .draw')].filter(p => !p.closest('#tail'));
const tailPath = document.querySelector('#tail .draw');
[...roomPaths, ...dogPaths, tailPath].forEach(p => {
  const L = p.getTotalLength();
  p.dataset.len = L;
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
});

// Paw prints: from the door to where the dog sits, alternating left/right.
const pawG = document.getElementById('paws');
const prints = [];
const N = 7;
const P0 = [180, 1415], P1 = [230, 1640], P2 = [430, 1600];
const bz = (u, k) => (1-u)*(1-u)*P0[k] + 2*(1-u)*u*P1[k] + u*u*P2[k];
const dbz = (u, k) => 2*(1-u)*(P1[k]-P0[k]) + 2*u*(P2[k]-P1[k]);
for (let i = 0; i < N; i++) {
  const u = i / (N - 1);
  const dx = dbz(u, 0), dy = dbz(u, 1), L = Math.hypot(dx, dy);
  const side = i % 2 ? 1 : -1;
  const x = bz(u, 0) + side * 15 * (-dy / L), y = bz(u, 1) + side * 15 * (dx / L);
  const ang = Math.atan2(dx, -dy) * 180 / Math.PI;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${x},${y}) rotate(${ang}) scale(0.9)`);
  g.innerHTML = '<ellipse cx="0" cy="6" rx="11" ry="9"/><circle cx="-12" cy="-8" r="4.5"/><circle cx="-4.5" cy="-15" r="4.5"/><circle cx="4.5" cy="-15" r="4.5"/><circle cx="12" cy="-8" r="4.5"/>';
  g.setAttribute('opacity', 0);
  pawG.appendChild(g);
  prints.push(g);
}

function draw(paths, t, a, b) {
  const n = paths.length, span = b - a, each = span * 0.45;
  paths.forEach((p, i) => {
    const s = a + (span - each) * (n > 1 ? i / (n - 1) : 0);
    p.style.strokeDashoffset = p.dataset.len * (1 - prog(t, s, s + each));
  });
}

window.renderAt = function (t) {
  draw(roomPaths, t, 0.3, 3.6);

  prints.forEach((g, i) => {
    const s = 3.7 + i * 0.36;
    const appear = prog(t, s, s + 0.15);
    const fade = 1 - 0.65 * prog(t, 9.5, 11);
    g.setAttribute('opacity', appear * fade * 0.85);
  });

  draw(dogPaths, t, 6.4, 9.0);
  draw([tailPath], t, 8.6, 9.3);
  const wag = prog(t, 10.4, 10.8) * Math.sin((t - 10.4) * 2 * Math.PI * 2.2) * 16;
  document.getElementById('tail').setAttribute('transform', `translate(112,418) rotate(${wag})`);
  document.getElementById('dogSolid').setAttribute('opacity', prog(t, 8.4, 8.9));

  document.getElementById('mDogC').setAttribute('r', 380 * prog(t, 8.8, 10.4));
  document.getElementById('mFrameC').setAttribute('r', 420 * prog(t, 9.3, 11.2));
  document.getElementById('portraitInk').setAttribute('opacity', prog(t, 10.2, 11.2));
  document.getElementById('frameGold').setAttribute('opacity', prog(t, 10.6, 11.4));

  // Final move: lift the scene up, make room for the end card.
  const m = prog(t, 11.8, 12.9);
  const sc = 1 - 0.38 * m;
  document.getElementById('world').setAttribute('transform',
    `translate(${540 - 540 * sc},${-60 * m}) scale(${sc})`);
  document.getElementById('card').setAttribute('opacity', prog(t, 12.5, 13.3));
};
window.renderAt(0);
</script>
</body>
</html>
