<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a)));

// Expand <use> in the dog's head so each stroke can be "drawn".
const drawUse = document.querySelector('.drawUse');
const headClone = document.getElementById('headInk').cloneNode(true);
headClone.removeAttribute('id');
headClone.querySelectorAll('path').forEach(p => p.classList.add('draw', 'dogHead'));
drawUse.replaceWith(headClone);

const roomPaths = [...document.querySelectorAll('#room .draw')];
const dogPaths = [...document.querySelectorAll('#dogHead .draw'), ...[...document.querySelectorAll('#dogBody .draw')].filter(p => !p.closest('#tail'))];
const tailPath = document.querySelector('#tail .draw');
[...roomPaths, ...dogPaths, tailPath].forEach(p => {
  const L = p.getTotalLength();
  p.dataset.len = L;
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
});

// Paw prints: from the door to where the dog sits, alternating left/right.
const pawG = document.getElementById('paws');
const prints = [];
const N = 7;
const P0 = [180, 1415], P1 = [230, 1640], P2 = [430, 1600];
const bz = (u, k) => (1-u)*(1-u)*P0[k] + 2*(1-u)*u*P1[k] + u*u*P2[k];
const dbz = (u, k) => 2*(1-u)*(P1[k]-P0[k]) + 2*u*(P2[k]-P1[k]);
for (let i = 0; i < N; i++) {
  const u = i / (N - 1);
  const dx = dbz(u, 0), dy = dbz(u, 1), L = Math.hypot(dx, dy);
  const side = i % 2 ? 1 : -1;
  const x = bz(u, 0) + side * 15 * (-dy / L), y = bz(u, 1) + side * 15 * (dx / L);
  const ang = Math.atan2(dx, -dy) * 180 / Math.PI;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${x},${y}) rotate(${ang}) scale(0.9)`);
  g.innerHTML = '<ellipse cx="0" cy="6" rx="11" ry="9"/><circle cx="-12" cy="-8" r="4.5"/><circle cx="-4.5" cy="-15" r="4.5"/><circle cx="4.5" cy="-15" r="4.5"/><circle cx="12" cy="-8" r="4.5"/>';
  g.setAttribute('opacity', 0);
  pawG.appendChild(g);
  prints.push(g);
}

function draw(paths, t, a, b) {
  const n = paths.length, span = b - a, each = span * 0.45;
  paths.forEach((p, i) => {
    const s = a + (span - each) * (n > 1 ? i / (n - 1) : 0);
    p.style.strokeDashoffset = p.dataset.len * (1 - prog(t, s, s + each));
  });
}


// ── Impasto Recall: the painting is rebuilt knife stroke by knife stroke ──
const KP = 840, AN = 300;
const kc = document.getElementById('kc'), kx = kc.getContext('2d');
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const sm = v => v * v * (3 - 2 * v), u = sm(xf), v = sm(yf);
  const h = (i, j) => hash(xi + i + 0.13, yi + j + 0.71);
  return (h(0, 0) * (1 - u) + h(1, 0) * u) * (1 - v) + (h(0, 1) * (1 - u) + h(1, 1) * u) * v;
}
function boxBlur(a, r) {
  const out = new Float32Array(a.length), tmp = new Float32Array(a.length), c = v => Math.max(0, Math.min(AN - 1, v));
  for (let y = 0; y < AN; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += a[y * AN + c(x)];
    for (let x = 0; x < AN; x++) { tmp[y * AN + x] = acc / (2 * r + 1); acc += a[y * AN + c(x + r + 1)] - a[y * AN + c(x - r)]; } }
  for (let x = 0; x < AN; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += tmp[c(y) * AN + x];
    for (let y = 0; y < AN; y++) { out[y * AN + x] = acc / (2 * r + 1); acc += tmp[c(y + r + 1) * AN + x] - tmp[c(y - r) * AN + x]; } }
  return out;
}
const pct = (a, q) => { const s = Array.from(a).sort((p, r) => p - r); return s[Math.floor(q * (s.length - 1))] || 1; };

let K = null;
function planKnife(img) {
  const src = document.createElement('canvas'); src.width = src.height = 1024;
  const sx = src.getContext('2d'); sx.drawImage(img, 0, 0, 1024, 1024);
  const pix = sx.getImageData(0, 0, 1024, 1024).data;
  const an = document.createElement('canvas'); an.width = an.height = AN;
  const ax = an.getContext('2d'); ax.drawImage(img, 0, 0, AN, AN);
  const ap = ax.getImageData(0, 0, AN, AN).data;
  let lum = new Float32Array(AN * AN);
  for (let i = 0; i < AN * AN; i++) lum[i] = (0.299 * ap[4 * i] + 0.587 * ap[4 * i + 1] + 0.114 * ap[4 * i + 2]) / 255;
  lum = boxBlur(boxBlur(lum, 2), 1);
  const gxF = new Float32Array(AN * AN), gyF = new Float32Array(AN * AN), mag = new Float32Array(AN * AN);
  const L = (x, y) => lum[Math.max(0, Math.min(AN - 1, y)) * AN + Math.max(0, Math.min(AN - 1, x))];
  for (let y = 0; y < AN; y++) for (let x = 0; x < AN; x++) {
    const gx = (L(x + 1, y - 1) + 2 * L(x + 1, y) + L(x + 1, y + 1)) - (L(x - 1, y - 1) + 2 * L(x - 1, y) + L(x - 1, y + 1));
    const gy = (L(x - 1, y + 1) + 2 * L(x, y + 1) + L(x + 1, y + 1)) - (L(x - 1, y - 1) + 2 * L(x, y - 1) + L(x + 1, y - 1));
    const i = y * AN + x; gxF[i] = gx; gyF[i] = gy; mag[i] = Math.hypot(gx, gy);
  }
  const detailF = boxBlur(mag, 4), magRef = pct(mag, 0.9), detailRef = pct(detailF, 0.9);
  const at = (f, x, y) => f[Math.max(0, Math.min(AN - 1, Math.floor(y / KP * AN))) * AN + Math.max(0, Math.min(AN - 1, Math.floor(x / KP * AN)))];
  const col = (x, y) => { const i = 4 * (Math.max(0, Math.min(1023, Math.floor(y / KP * 1024))) * 1024 + Math.max(0, Math.min(1023, Math.floor(x / KP * 1024)))); return [pix[i], pix[i + 1], pix[i + 2]]; };

  const rnd = mulberry32(12345);
  const gauss = s => s * Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd());
  const P = 6, knife = 66, minW = 4, ratio = Math.pow(minW / knife, 1 / (P - 1));
  const strokes = [];
  for (let p = 0; p < P; p++) {
    const t = p / (P - 1), w = knife * Math.pow(ratio, p), step = w * (p === 0 ? 0.6 : 0.9), pass = [];
    for (let gy = -step; gy < KP + step; gy += step) for (let gx = -step; gx < KP + step; gx += step) {
      const x = gx + (rnd() - 0.5) * step, y = gy + (rnd() - 0.5) * step;
      const d = at(detailF, x, y) / detailRef;
      const keep = p === 0 ? 1 : Math.max(0.02, Math.min(1, Math.pow(d / (0.28 + 0.8 * t), 2)));
      if (rnd() > keep) continue;
      const g1 = at(gxF, x, y), g2 = at(gyF, x, y), str = Math.min(1, Math.hypot(g1, g2) / magRef);
      const edgeA = Math.atan2(g2, g1) + Math.PI / 2, noiseA = vnoise(x * 0.003, y * 0.003 + p * 7) * Math.PI * 3;
      const k = 0.8 * Math.pow(str, 0.7);
      let a = 0.5 * Math.atan2(k * Math.sin(2 * edgeA) + (1 - k) * Math.sin(2 * noiseA), k * Math.cos(2 * edgeA) + (1 - k) * Math.cos(2 * noiseA)) + gauss(0.12 + 0.1 * (1 - k));
      if (rnd() < 0.5) a += Math.PI;
      const len = w * 2.2 * (0.6 + 0.8 * rnd()) * (1 + 0.35 * k) * (1.25 - 0.35 * t);
      const ca = Math.cos(a), sa = Math.sin(a);
      const c0 = col(x, y), c1 = col(x + ca * len * 0.3, y + sa * len * 0.3), c2 = col(x - ca * len * 0.3, y - sa * len * 0.3);
      const drift = 0.06 * (1.15 - 0.5 * t), lm = gauss(drift * 150);
      const c = [0, 1, 2].map(j => Math.max(0, Math.min(255, (2 * c0[j] + c1[j] + c2[j]) / 4 + lm + gauss(drift * 35))));
      pass.push({ x, y, w, L: len, a, col: c, h: rnd() * 1000 });
    }
    for (let i = pass.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pass[i], pass[j]] = [pass[j], pass[i]]; }
    strokes.push(...pass);
  }
  const cum = []; let tot = 0;
  for (const s of strokes) { tot += s.w * s.L; cum.push(tot); }
  K = { strokes, cum, tot, cursor: 0 };
  ground();
}

function ground() {
  const rnd = mulberry32(7);
  kx.globalCompositeOperation = 'source-over';
  kx.fillStyle = '#6b4a2e'; kx.fillRect(0, 0, KP, KP);
  for (let i = 0; i < 60; i++) {
    const x = rnd() * KP, y = rnd() * KP, r = 60 + rnd() * 220, l = rnd() < 0.5 ? 255 : 0;
    const g = kx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${l},${l * 0.9},${l * 0.75},${0.03 + 0.05 * rnd()})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    kx.fillStyle = g; kx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
}

function knifeStroke(s) {
  const hw = s.w / 2, hl = s.L / 2, imp = 0.6;
  kx.save(); kx.translate(s.x, s.y); kx.rotate(s.a);
  kx.beginPath();
  kx.moveTo(-hl, -hw * (0.85 + 0.1 * hash(s.h, 1)));
  kx.quadraticCurveTo(0, -hw * (1.02 + 0.06 * hash(s.h, 2)), hl, -hw);
  for (let i = 1; i <= 6; i++) kx.lineTo(hl + (hash(s.h, 10 + i) - 0.35) * hw * 0.7, -hw + (2 * hw * i) / 6);
  kx.quadraticCurveTo(0, hw * (0.96 - 0.06 * hash(s.h, 3)), -hl, hw * (0.8 + 0.12 * hash(s.h, 4)));
  kx.closePath();
  kx.fillStyle = `rgb(${s.col[0] | 0},${s.col[1] | 0},${s.col[2] | 0})`;
  kx.fill(); kx.clip();
  const m = Math.min(9, 2 + Math.floor(s.w / 7));
  for (let i = 0; i < m; i++) {
    const yy = (hash(s.h, 30 + i) * 2 - 1) * hw;
    kx.strokeStyle = hash(s.h, 50 + i) > 0.5 ? `rgba(255,248,235,${0.05 + 0.12 * imp})` : `rgba(30,20,10,${0.04 + 0.1 * imp})`;
    kx.lineWidth = 0.5 + hash(s.h, 70 + i) * Math.max(1, s.w / 22);
    kx.beginPath(); kx.moveTo(-hl + hash(s.h, 90 + i) * hl * 0.6, yy);
    kx.lineTo(hl * (0.6 + 0.4 * hash(s.h, 110 + i)), yy + (hash(s.h, 130 + i) - 0.5) * hw * 0.15); kx.stroke();
  }
  const f = (-Math.sin(s.a) + Math.cos(s.a)) * 0.7071, lw = Math.max(1, s.w / 16), ey = f > 0 ? -hw + lw / 2 : hw - lw / 2;
  kx.lineWidth = lw;
  kx.strokeStyle = `rgba(255,250,240,${imp * 0.45 * Math.abs(f)})`; kx.beginPath(); kx.moveTo(-hl, ey); kx.lineTo(hl, ey); kx.stroke();
  kx.strokeStyle = `rgba(25,15,5,${imp * 0.4 * Math.abs(f)})`; kx.beginPath(); kx.moveTo(-hl, -ey); kx.lineTo(hl, -ey); kx.stroke();
  const g = kx.createLinearGradient(hl - hw * 0.6, 0, hl + hw * 0.3, 0);
  g.addColorStop(0, 'rgba(255,250,240,0)'); g.addColorStop(0.7, `rgba(255,250,240,${imp * 0.22})`); g.addColorStop(1, `rgba(20,12,4,${imp * 0.25})`);
  kx.fillStyle = g; kx.fillRect(hl - hw * 0.6, -hw * 1.2, hw * 1.2, hw * 2.4);
  kx.restore();
}

function knifeTo(frac) {
  const target = frac * K.tot;
  if (K.cursor > 0 && K.cum[K.cursor - 1] > target + 1) { ground(); K.cursor = 0; }
  while (K.cursor < K.strokes.length && K.cum[K.cursor] <= target) knifeStroke(K.strokes[K.cursor++]);
}

const PAINTING = window.PAINTING || 'painting.jpg';
document.getElementById('real').setAttribute('href', PAINTING);
window.ready = new Promise(res => {
  const img = new Image();
  img.onload = () => { planKnife(img); img.decode().then(res); };
  img.src = PAINTING;
});

const pops = [...document.querySelectorAll('.pop')];
const backOut = u => { const c = 1.9; u = clamp(u); return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
// Hops: [start, duration, height]
const HOPS = [[7.05, 0.42, 70], [7.55, 0.38, 46], [11.0, 0.46, 84]];

window.renderAt = function (t) {
  draw(roomPaths, t, 0.2, 2.6);

  // Coloured objects pop in with a little overshoot.
  pops.forEach(g => {
    const t0 = +g.dataset.t, [ox, oy] = g.dataset.o.split(',').map(Number);
    const u = clamp((t - t0) / 0.45), k = u <= 0 ? 0 : backOut(u);
    g.setAttribute('opacity', clamp(u * 3));
    g.setAttribute('transform', `translate(${ox},${oy}) scale(${Math.max(0.001, k)}) translate(${-ox},${-oy})`);
  });

  prints.forEach((g, i) => {
    const s = 2.6 + i * 0.27;
    g.setAttribute('opacity', prog(t, s, s + 0.15) * (1 - 0.65 * prog(t, 9, 10.5)) * 0.85);
  });

  // The dog is drawn, coloured, then comes alive.
  draw(dogPaths, t, 4.2, 6.2);
  draw([tailPath], t, 6.0, 6.5);
  document.getElementById('dogSolid').setAttribute('opacity', prog(t, 6.0, 6.4));
  const washO = prog(t, 6.2, 7.0);
  document.getElementById('bodyWash').setAttribute('opacity', washO);
  document.getElementById('headWashG').setAttribute('opacity', washO);

  let h = 0, air = 0, squash = 0;
  for (const [t0, d, H] of HOPS) {
    const u = (t - t0) / d;
    if (u > 0 && u < 1) { h += H * Math.sin(Math.PI * u); air = Math.max(air, Math.sin(Math.PI * u)); }
    const pre = (t0 - t) / 0.14, post = (t - t0 - d) / 0.16;          // crouch before, squash on landing
    if (pre > 0 && pre < 1) squash = Math.max(squash, Math.sin(Math.PI * pre));
    if (post > 0 && post < 1) squash = Math.max(squash, Math.sin(Math.PI * post));
  }
  const sx = 1 - 0.05 * air + 0.07 * squash, sy = 1 + 0.08 * air - 0.11 * squash;
  document.getElementById('dog').setAttribute('transform',
    `translate(540,${1180 - h}) translate(0,420) scale(${sx},${sy}) translate(0,-420)`);

  // Head: follows the ball, then a curious tilt up at the painting.
  const look = 11 * prog(t, 6.9, 7.3) * (1 - prog(t, 8.0, 8.4));
  const tilt = -13 * prog(t, 8.5, 8.9) * (1 - prog(t, 10.7, 11.0));
  const bob = 4 * air;
  document.getElementById('dogHead').setAttribute('transform',
    `translate(0,${-bob - 6 * prog(t, 8.5, 8.9) * (1 - prog(t, 10.7, 11.0))}) rotate(${look + tilt} 0 110)`);

  const wagAmp = prog(t, 6.4, 6.8) * (18 + 14 * air);
  document.getElementById('tail').setAttribute('transform', `translate(112,418) rotate(${wagAmp * Math.sin(t * 2 * Math.PI * 2.4)})`);

  // Tennis ball rolls in across the rug and settles by the dog.
  const bu = clamp((t - 6.4) / 1.5), roll = 1 - Math.pow(1 - bu, 3);
  const bx = 1160 - 470 * roll, by = 1640 - 10 * Math.abs(Math.sin(roll * Math.PI * 3)) * (1 - roll);
  document.getElementById('ball').setAttribute('transform', `translate(${bx},${by})`);
  document.getElementById('ballSpin').setAttribute('transform', `rotate(${-(1160 - bx) / 24 * 180 / Math.PI})`);

  // The portrait blooms into the empty frame, built by the knife, then the real painting.
  document.getElementById('mFrameC').setAttribute('r', 430 * prog(t, 7.4, 8.8));
  knifeTo(prog(t, 7.4, 10.6));
  document.getElementById('real').setAttribute('opacity', prog(t, 10.4, 11.2));
  document.getElementById('frameGold').setAttribute('opacity', prog(t, 10.2, 11.0));

  // Camera: push into the painting until it fills the screen, hold, then
  // pull back to the end-card layout. Scale is interpolated in log space.
  const ZOOM = 2.3, FX = 540, FY = 650;                       // frame centre
  const states = [
    { s: 1, x: 0, y: 0 },
    { s: ZOOM, x: 540 - FX * ZOOM, y: 1000 - FY * ZOOM },
    { s: 0.62, x: 540 - 540 * 0.62, y: -60 },
  ];
  const lerpState = (A, B, u) => {
    const sc = Math.exp(Math.log(A.s) + (Math.log(B.s) - Math.log(A.s)) * u);
    const k = (A.s === B.s) ? u : (sc - A.s) / (B.s - A.s);   // keeps the move straight on screen
    return { s: sc, x: A.x + (B.x - A.x) * k, y: A.y + (B.y - A.y) * k };
  };
  const zin = prog(t, 11.0, 11.9), zout = prog(t, 12.6, 13.4);
  const cam = zout > 0 ? lerpState(states[1], states[2], zout) : lerpState(states[0], states[1], zin);
  document.getElementById('world').setAttribute('transform', `translate(${cam.x},${cam.y}) scale(${cam.s})`);
  document.getElementById('card').setAttribute('opacity', prog(t, 13.1, 13.8));
};
window.ready.then(() => window.renderAt(0));
</script>
</body>
</html>
