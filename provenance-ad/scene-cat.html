<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a)));
const backOut = u => { const c = 1.9; u = clamp(u); return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const lerp = (a, b, u) => a + (b - a) * u;
const NS = 'http://www.w3.org/2000/svg';

// Eyes: amber iris, slit pupil, a lid clipped to the eye that closes from the top.
const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };
const eyes = [...document.querySelectorAll('.eye')].map((g, k) => {
  const x = +g.dataset.x, y = -252;
  const clip = mk('clipPath', { id: 'eyeClip' + k }, g);
  mk('ellipse', { cx: x, cy: y, rx: 15, ry: 13 }, clip);
  mk('ellipse', { cx: x, cy: y, rx: 15, ry: 13, fill: '#F2C230' }, g);
  const inner = mk('g', { 'clip-path': `url(#eyeClip${k})` }, g);
  const pupil = mk('ellipse', { cx: x, cy: y, rx: 3.5, ry: 11, fill: '#111' }, inner);
  const glint = mk('circle', { cx: x - 4, cy: y - 5, r: 3, fill: '#FFF8EC' }, inner);
  const lid = mk('path', { d: '', fill: '#1F1C24', stroke: '#0E0C10', 'stroke-width': 2.5 }, inner);
  return { x, y, pupil, glint, lid };
});
function setEyes(close, lookX, lookY, dilate) {
  for (const e of eyes) {
    const px = e.x + lookX, py = e.y + lookY;
    e.pupil.setAttribute('cx', px); e.pupil.setAttribute('cy', py); e.pupil.setAttribute('rx', 3.5 + 4 * dilate);
    e.glint.setAttribute('cx', px - 4); e.glint.setAttribute('cy', py - 5);
    const b = e.y - 13 + 27 * close;                     // lower edge of the lid
    e.lid.setAttribute('d', `M ${e.x - 18},${e.y - 30} L ${e.x + 18},${e.y - 30} L ${e.x + 18},${b} Q ${e.x},${b + 4} ${e.x - 18},${b} Z`);
  }
}

const pops = [...document.querySelectorAll('.pop')];
const DOG = window.PAINTING || 'painting.jpg', CAT_IMG = window.CATPAINTING || 'painting-cat.jpg';
document.getElementById('dogPainting').setAttribute('href', DOG);
document.querySelectorAll('.catpainting').forEach(el => el.setAttribute('href', CAT_IMG));
const load = src => new Promise(res => { const im = new Image(); im.onload = () => im.decode().then(res); im.src = src; });
window.ready = Promise.all([load(DOG), load(CAT_IMG)]);

const SOFA = { x: 930, y: 1300, s: 0.62 }, FLOOR = { x: 720, y: 1610, s: 0.92 };
const blink = (t, t0, d = 0.16) => { const u = (t - t0) / d; return u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0; };

window.renderAt = function (t) {
  // Everything is already in the room; the decor sits still (no pop-in in episode 2).
  pops.forEach(g => { g.setAttribute('opacity', 1); g.removeAttribute('transform'); });
  const bowl = document.querySelector('.pop[data-o="800,1565"]');
  if (bowl) bowl.setAttribute('transform', 'translate(170,20)');

  // ── Darkness, two amber eyes; the shelf lamp clicks on at 2.5 s with a small flicker.
  let dark = 0.94;
  if (t >= 2.5) dark = t < 2.55 ? 0.25 : t < 2.62 ? 0.6 : 0.6 * (1 - prog(t, 2.62, 2.85));
  document.getElementById('dark').setAttribute('opacity', dark);
  document.getElementById('glow').setAttribute('opacity', t >= 2.5 ? (t < 2.55 ? 1 : t < 2.62 ? 0.4 : 1) : 0);

  // ── The cat: on the sofa, unimpressed by the dog's portrait, jumps down under the empty frame.
  const J0 = 4.4, J1 = 4.95, ju = clamp((t - J0) / (J1 - J0)), je = ease(ju);
  const pos = { x: lerp(SOFA.x, FLOOR.x, je), y: lerp(SOFA.y, FLOOR.y, je) - 170 * Math.sin(Math.PI * ju), s: lerp(SOFA.s, FLOOR.s, je) };
  const air = ju > 0 && ju < 1 ? Math.sin(Math.PI * ju) : 0;
  const crouch = Math.max(blink(t, 4.22, 0.2), blink(t, 4.95, 0.18));
  const sx = pos.s * (1 - 0.06 * air + 0.07 * crouch), sy = pos.s * (1 + 0.09 * air - 0.1 * crouch);
  document.getElementById('cat').setAttribute('transform',
    `translate(${pos.x},${pos.y}) rotate(${-9 * air}) scale(${sx},${sy})`);

  const lookDog = prog(t, 2.8, 3.2) * (1 - prog(t, 5.2, 5.8));          // glance at the dog's portrait
  const dreamy = prog(t, 8.4, 8.9) * (1 - prog(t, 12.1, 12.4));        // remembering
  const proud = prog(t, 5.9, 6.4) * (1 - dreamy);
  document.getElementById('catHead').setAttribute('transform',
    `translate(${-8 * lookDog},${-5 * proud - 5 * dreamy}) rotate(${-6 * lookDog - 7 * dreamy} 0 -200)`);
  let close = 0.55 * prog(t, 3.3, 3.8) * (1 - prog(t, 4.95, 5.2));      // "seriously?"
  close = Math.max(close, blink(t, 0.9), blink(t, 1.85));                // blinks in the dark
  close = Math.max(close, blink(t, 6.6, 0.7) * 0.95);                    // slow "cat kiss" blink
  close = Math.max(close, 0.42 * dreamy, 0.85 * prog(t, 12.35, 12.6) * (1 - prog(t, 13.4, 13.8)));
  setEyes(close, -5 * lookDog, -3 * lookDog - 3 * dreamy, 1 - prog(t, 2.5, 3.2));
  const flick = blink(t, 3.85, 0.35) * 22 + blink(t, 12.35, 0.5) * 26 + Math.sin(t * 2.2) * 5 * prog(t, 5.9, 6.4);
  document.getElementById('tail').setAttribute('transform', `rotate(${-flick} 66 -10)`);

  // ── Memory: bubbles while the camera is on her face, then the cloud flies into the empty frame.
  const travel = prog(t, 10.8, 11.7), morph = prog(t, 11.6, 12.5);
  [...document.querySelectorAll('.tp')].forEach((c, i) => {
    const u = clamp((t - (8.7 + i * 0.2)) / 0.3), cx = +c.getAttribute('cx'), cy = +c.getAttribute('cy');
    c.setAttribute('opacity', (u > 0 ? Math.min(1, u * 3) : 0) * (1 - prog(t, 10.8, 11.2)));
    c.setAttribute('transform', `translate(${cx},${cy}) scale(${Math.max(0.001, backOut(u))}) translate(${-cx},${-cy})`);
  });
  const pop = clamp((t - 9.75) / 0.5), popS = pop > 0 ? backOut(pop) : 0.001;
  const mx = lerp(560, 750, travel), my = lerp(1080, 620, travel) - 50 * Math.sin(Math.PI * travel);
  const ms = lerp(0.45, 300 / 420, travel) * popS;
  document.getElementById('memMove').setAttribute('transform', `translate(${mx},${my}) scale(${Math.max(0.001, ms)}) translate(-540,-650)`);
  const swell = `translate(540,650) scale(${1 + 1.9 * morph}) translate(-540,-650)`;
  document.querySelectorAll('.cc, .cb').forEach(c => c.setAttribute('transform', swell));
  const fc = document.getElementById('memFrameClip');
  if (morph > 0) fc.setAttribute('clip-path', 'url(#frameInner)'); else fc.removeAttribute('clip-path');
  document.getElementById('memory').setAttribute('opacity', pop > 0 ? 1 : 0);
  document.getElementById('cloudBack').setAttribute('opacity', 1 - prog(t, 11.7, 12.4));
  document.getElementById('vig').setAttribute('opacity', 1 - morph);
  const breathe = (1 - travel) * prog(t, 9.95, 10.3) * 0.025 * Math.sin(t * Math.PI * 1.4);
  document.getElementById('dream').setAttribute('transform', `translate(540,650) scale(${1 + breathe}) translate(-540,-650)`);
  document.getElementById('dream').setAttribute('opacity', prog(t, 9.9, 10.3));
  document.getElementById('real').setAttribute('opacity', prog(t, 11.7, 12.5));
  document.getElementById('frameGold').setAttribute('opacity', prog(t, 12.1, 12.6));

  // ── Camera.
  const lerpState = (A, B, u) => {
    const sc = Math.exp(Math.log(A.s) + (Math.log(B.s) - Math.log(A.s)) * u);
    const k = (A.s === B.s) ? u : (sc - A.s) / (B.s - A.s);
    return { s: sc, x: A.x + (B.x - A.x) * k, y: A.y + (B.y - A.y) * k };
  };
  const at = (s, wx, wy, scx, scy) => ({ s, x: scx - wx * s, y: scy - wy * s });
  const WIDE = { s: 1, x: 0, y: 0 };
  const FACE = at(1.8, 720, 1380, 540, 1000);
  const PAINT = at(3.0, 750, 620, 540, 960);
  const CARD = { s: 0.62, x: 540 - 540 * 0.62, y: -60 };
  const MOVES = [[7.9, 8.6, WIDE, FACE], [9.2, 10.1, FACE, WIDE], [12.6, 13.4, WIDE, PAINT], [14.0, 14.7, PAINT, CARD]];
  let cam = WIDE;
  for (const [t0, t1, A, B] of MOVES) { if (t >= t0) cam = lerpState(A, B, prog(t, t0, t1)); }
  document.getElementById('world').setAttribute('transform', `translate(${cam.x},${cam.y}) scale(${cam.s})`);
  document.getElementById('card').setAttribute('opacity', prog(t, 14.4, 15.0));
};
window.ready.then(() => window.renderAt(0));
</script>
</body>
</html>
